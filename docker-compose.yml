version: '3.8'

services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: contrastive-trainer
    container_name: trainer-container
    volumes:
      - ./src
    working_dir: /app
    command: ["python", "train.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
